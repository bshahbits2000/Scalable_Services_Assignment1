services:
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - "${SEATFLOW_MONITORING_DIR:?Set SEATFLOW_MONITORING_DIR}/blackbox.yml:/etc/blackbox/blackbox.yml:ro"
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - "${SEATFLOW_MONITORING_DIR}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - seatflow_prometheus:/prometheus
    depends_on: [blackbox]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: "${SEATFLOW_GRAFANA_PASSWORD:?Set a local random admin password}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "${SEATFLOW_MONITORING_DIR}/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "${SEATFLOW_MONITORING_DIR}/grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - seatflow_grafana:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
volumes:
  seatflow_prometheus:
  seatflow_grafana:
